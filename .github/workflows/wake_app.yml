name: Wake Up Streamlit App

on:
  schedule:
    # Runs every 8 hours (At minute 0 past every 8th hour)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows you to trigger this manually whenever you want

jobs:
  wake-app-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Wake Up Script
      run: python wake_app.py
